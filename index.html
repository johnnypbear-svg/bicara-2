function speakArt(s,i){speak(ARTICLES[s].lines[i].id)}

const KEY="bicara_words_v1";
function loadWords(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}
 return DATA.map(w=>({...w,mastery:1,lookup:0,wrong:0,notebook:false,custom:false}));}

function save(){try{localStorage.setItem(KEY,JSON.stringify(words))}catch(e){}}
let view="scene", scene="全部", q="", found=null;
const tabs={scene:"场景词库",catalog:"总目录",text:"文字库",query:"查询",add:"新增",stats:"统计"};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function speak(t){if(window.AndroidTTS){AndroidTTS.speak(t);return}
 if(!("speechSynthesis" in window)){alert("设备不支持语音");return}
 const u=new SpeechSynthesisUtterance(t);u.lang="id-ID";speechSynthesis.cancel();speechSynthesis.speak(u);}
function go(v){view=v;render()}
function render(){
 save();
 document.getElementById("title").textContent=tabs[view];
 document.getElementById("nav").innerHTML=Object.keys(tabs).map(k=>`<button class="${k===view?'on':''}" onclick="go('${k}')">${tabs[k]}</button>`).join("");
 ({scene:vScene,catalog:vCatalog,text:vText,query:vQuery,add:vAdd,stats:vStats})[view](document.getElementById("main"));
}
function card(w){return `<div class="card">
 <div class="row"><b>${esc(w.indonesian)}</b><button class="s" onclick="speak('${esc(w.indonesian).replace(/'/g,"\\'")}')">🔊</button>
 <span class="m${w.mastery}">●</span><span class="tag">${esc(w.scene)}</span>${w.custom?'<span class="tag">自建</span>':''}</div>
 <div>${esc(w.chinese)||'<span class="mid">待补充释义</span>'}</div>
 ${w.example?`<div class="ex">${esc(w.example)}<br><span class="mid">${esc(w.example_zh)}</span>
 <br><button class="s" onclick="speak('${esc(w.example).replace(/'/g,"\\'")}')">🔊例句</button></div>`:'<div class="mid">暂无例句</div>'}
 <div class="row mid">查询${w.lookup}次 错误${w.wrong}次
 <button class="s" onclick="mark('${w.id}',0)">不会</button><button class="s" onclick="mark('${w.id}',1)">模糊</button><button class="s" onclick="mark('${w.id}',2)">掌握</button></div></div>`}
function vScene(m){
 const list=scene==="全部"?words:words.filter(w=>w.scene===scene);
 m.innerHTML=`<div class="row">${SCENES.map(s=>`<button class="s" onclick="scene='${s}';render()">${esc(s)}</button>`).join("")}</div>${artHTML(scene)}
 <h3>${esc(scene)}（${list.length}）</h3>${list.slice(0,200).map(card).join("")}
 ${list.length>200?`<p class="mid">仅显示前200条，可用“查询”搜索其余单词</p>`:''}`;

function find(t){t=t.trim().toLowerCase();return words.find(w=>w.indonesian.toLowerCase()===t)}
function vQuery(m){
 m.innerHTML=`<input id="qi" placeholder="输入印尼单词" value="${esc(q)}" onkeydown="if(event.key==='Enter')doQ()">
 <button class="b" onclick="doQ()">查询</button>
 <div id="res">${found?card(found):(q?`<div class="card"><p>词库中没有“${esc(q)}”</p><p class="mid">已自动记入统计为生词</p></div>`:'')}</div>`;
}
function doQ(){
 q=document.getElementById("qi").value.trim();if(!q)return;
 const w=find(q);
 if(w){w.lookup++;w.notebook=true;found=w}
 else{const n={id:"u"+Date.now(),indonesian:q,chinese:"",scene:"文字库",example:"",mastery:0,lookup:1,wrong:0,notebook:true,custom:true};
  words.push(n);found=n}
 render();
}
function mark(id,lv){const w=words.find(x=>x.id===id);if(!w)return;w.mastery=lv;w.notebook=lv<2;if(lv===0)w.wrong++;render()}

 <textarea id="bt" rows="6"></textarea><button class="b" onclick="batchAdd()">批量自动归类</button>`;
}
function addW(){
 const i=document.getElementById("a1").value.trim();if(!i){alert("请填写印尼单词");return}
 words.push({id:"c"+Date.now(),indonesian:i,chinese:document.getElementById("a2").value.trim(),scene:document.getElementById("a3").value,
  example:document.getElementById("a4").value.trim(),example_zh:document.getElementById("a5").value.trim(),mastery:1,lookup:0,wrong:0,notebook:false,custom:true});
 alert("已保存");view="scene";render();
}
function vStats(m){
 const q=words.filter(w=>w.lookup>0).sort((a,b)=>b.lookup-a.lookup);
 const nb=words.filter(w=>w.notebook);
 const cnt={};q.forEach(w=>cnt[w.scene]=(cnt[w.scene]||0)+w.lookup);
 m.innerHTML=`<div class="card"><h3>总览</h3><div class="mid">词库 ${words.length} 条｜已查询 ${q.length} 个｜生词本 ${nb.length} 个｜自建 ${words.filter(w=>w.custom).length} 条</div></div>
 <div class="card"><h3>按场景查询次数</h3>${Object.keys(cnt).map(k=>`<div class="row"><span class="tag">${esc(k)}</span> ${cnt[k]}次</div>`).join("")||'<span class="mid">暂无查询</span>'}</div>
 <h3>查询排行（生词优先）</h3>${q.map(w=>`<div class="card"><div class="row"><b>${esc(w.indonesian)}</b> <span class="m${w.mastery}">●</span>
 <span class="mid">${esc(w.chinese)}</span></div><div class="mid">查询${w.lookup}次｜错误${w.wrong}次｜${esc(w.scene)}</div></div>`).join("")||'<p class="mid">还没有查询记录</p>'}`;
}
const KW=[["色","颜色"],["机票|行李|护照|登机|航班|安检|票|秤|飞机|机场|航","机场"],["经济|价格|钱|投资|银行|利润|生意","经济"],["纸|机器|机械|工厂|生产|包装","纸巾设备制造"],["电路|板|焊|元件|电子","PCB板制造"],["房间|客人|前台|预订|住宿|过夜|酒店","酒店"],
["买|卖|价|钱|折扣|商品|衬衫|裙|找零|贵|便宜|店","购物"],["吃|喝|饭|菜|食|辣|苦|生的|番茄|辣椒|葱|蒜|点单|烤|汤","餐饮"],
["健康|医|检查|胃|头|手|眼|鼻|腿|X光|病","身体与健康"],["工作|学|课|老师|学生|考试|作业|公司|老板|会议","工作与学习"],
["雨|热|冷|天气|风|云|太阳","天气"],["上|下|左|右|前|后|里|外|旁|对面","方位"],
["天|昨|明|现在|以后|之前|经常|有时|总是|每","时间与频率"],["旅|游|景|山|海|湖|庙|去|车|路|坐","旅游"],
["说|聊|朋友|邀请|见面|讲","社交与聊天"],["高|矮|大|小|漂亮|聪明|胖|瘦|好|坏|长|短","描述与性格"]];
function classify(idn,zh){
 const hit=DATA.find(w=>w.indonesian.toLowerCase()===idn.toLowerCase()); if(hit) return hit.scene;
 for(const [re,s] of KW) if(new RegExp(re).test(zh)) return s;
 return "文字库";
}
function batchAdd(){
 const lines=document.getElementById("bt").value.split(/\n+/).map(s=>s.trim()).filter(Boolean);
 let add=0,skip=0;
 for(const l of lines){
  const [i0,...rest]=l.split("="); const idn=(i0||"").trim(); const zh=rest.join("=").trim();
  if(!idn) continue;
  if(words.some(w=>w.indonesian.toLowerCase()===idn.toLowerCase())){skip++;continue}
  words.push({id:"c"+Date.now()+Math.random(),indonesian:idn,chinese:zh,scene:classify(idn,zh),example:"",example_zh:"",
    mastery:1,lookup:0,wrong:0,notebook:false,custom:true}); add++;
 }
 alert(`新增 ${add} 条，跳过重复 ${skip} 条`); view="scene"; render();
}
function speakId(id){const w=words.find(x=>x.id===id);if(w)speak(w.indonesian)}
function vCatalog(m){
 const s=[...words].sort((a,b)=>a.indonesian.localeCompare(b.indonesian,"id"));
 m.innerHTML=`<p class="mid">按印尼文字母顺序，共 ${s.length} 条</p>`+s.map((w,i)=>
  `<div class="row" style="padding:6px 0;border-bottom:1px solid #eee"><span class="mid" style="width:40px">${i+1}</span>
  <div style="flex:1"><b>${esc(w.indonesian)}</b><div class="mid" style="font-size:13px">${esc(w.chinese)||'待补充'}</div></div>
  <button class="s" onclick="speakId('${w.id}')">🔊</button></div>`).join("");
}
function vText(m){
 m.innerHTML=`<p class="mid">无法归入场景的单词和句子都在这里，一整个文字库，方便搜索。</p>
 <textarea id="tp" rows="4" placeholder="粘贴句子或单词，每行一条。例：Saya suka teh. = 我喜欢茶。"></textarea>
 <button class="b" onclick="pasteText()">存入文字库</button>
 <input id="tq" placeholder="搜索文字库" oninput="drawText()" style="margin-top:10px">
 <div id="tl"></div>`;
 drawText();
}
function drawText(){
 const kw=(document.getElementById("tq")?.value||"").trim().toLowerCase();
 const list=words.filter(w=>w.scene==="文字库");
 const show=list.filter(w=>!kw||(w.indonesian+" "+w.chinese+" "+(w.example||"")).toLowerCase().includes(kw));
 const el=document.getElementById("tl"); if(!el) return;
 el.innerHTML=`<h3>共 ${list.length} 条，显示 ${show.length} 条</h3>`+show.map(w=>
  `<div class="card"><div class="row"><b>${esc(w.indonesian)}</b><button class="s" onclick="speakId('${w.id}')">🔊</button></div>
  <div class="mid">${esc(w.chinese)}</div></div>`).join("");
}
function pasteText(){
 const lines=document.getElementById("tp").value.split(/\n+/).map(s=>s.trim()).filter(Boolean);
 let n=0;
 for(const l of lines){
  const [a,...r]=l.split("="); const idn=(a||"").trim(), zh=r.join("=").trim();
  if(!idn) continue;
  words.push({id:"t"+Date.now()+Math.random(),indonesian:idn,chinese:zh,scene:"文字库",example:"",example_zh:"",
   mastery:1,lookup:0,wrong:0,notebook:false,custom:true}); n++;
 }
 save(); alert(`已存入 ${n} 条`); document.getElementById("tp").value=""; drawText();
}
render();
